<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clre20</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-main: #f0f2f5;
      --text-muted: #7d8590;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 120px 24px 60px;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    /* 頂部自我介紹 */
    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }

    p.bio {
      font-size: 0.98rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* 項目列表區 */
    .section-title {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Spotlight 卡片效果 */
    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      transition: border-color 0.25s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(400px circle at var(--mouse-x, -100px) var(--mouse-y, -100px), rgba(255, 255, 255, 0.06), transparent 80%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .arrow {
      color: var(--text-muted);
      font-size: 1rem;
      transition: transform 0.2s ease, color 0.2s ease;
      z-index: 1;
    }

    .card:hover .arrow {
      color: var(--text-main);
      transform: translate(2px, -2px);
    }

    /* 頁尾微連結 */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>clre20.</h1>
      <p class="bio">
        
      </p>
    </header>

    <main>
      <div class="section-title">Directory</div>
      <div class="list">
        <!-- 指向倉庫內的 penguin 資料夾 -->
        <a href="./penguin/" class="card">
          <div class="card-info">
            <div class="card-title">Penguin Project</div>
            <div class="card-desc">展示頁面與互動內容</div>
          </div>
          <span class="arrow">↗</span>
        </a>

        <!-- 外部 GitHub 連結 -->
        <a href="https://github.com/clre20" target="_blank" rel="noopener noreferrer" class="card">
          <div class="card-info">
            <div class="card-title">GitHub Profile</div>
            <div class="card-desc">查看開源專案與程式碼庫</div>
          </div>
          <span class="arrow">↗</span>
        </a>
      </div>
    </main>

    <footer>
      <span></span>
      <div style="display: flex; gap: 16px;">
        <a href="https://github.com/clre20" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </footer>
  </div>

  <script>
    // 卡片跟隨滑鼠的聚光燈微互動 (Spotlight)
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
      });
    });
  </script>
</body>
</html>
